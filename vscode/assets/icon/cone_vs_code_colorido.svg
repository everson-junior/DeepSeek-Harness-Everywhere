<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <defs>
    <!-- Gradiente Cyberpunk: Ciano -> Roxo/Rosa -->
    <linearGradient id="neonGradient" x1="1" y1="1" x2="15" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#b134eb"/>
    </linearGradient>
  </defs>

  <!-- Coração estilizado com trilhas de circuito -->
  <path d="M8 3.5C7.2 2 5.2 1.3 3.5 2.2 1.8 3.1 1.2 5.2 2 7c1 2.2 4.5 5.5 5.8 6.7.1.1.3.1.4 0 .5-.5 1.6-1.5 2.8-2.7" 
        stroke="url(#neonGradient)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Balão de Chat (renderização) -->
  <path d="M9.5 7.5C9.5 6.4 10.8 5.5 12.5 5.5s3 0.9 3 2c0 0.5-.3 1-.8 1.4l.3 1.6-1.5-.6c-.3.1-.7.1-1 .1-1.7 0-3-.9-3-2z" 
        fill="url(#neonGradient)"/>
  
  <!-- Pontos dentro do chat -->
  <circle cx="11.2" cy="7.5" r="0.4" fill="#0d1117"/>
  <circle cx="12.5" cy="7.5" r="0.4" fill="#0d1117"/>
  <circle cx="13.8" cy="7.5" r="0.4" fill="#0d1117"/>

  <!-- Núcleo do motor / CPU local -->
  <rect x="4.5" y="4.5" width="2.5" height="2.5" rx="0.5" fill="url(#neonGradient)"/>
  <path d="M5.7 3.5v1M5.7 7v1M3.5 5.7h1M7 5.7h1" stroke="url(#neonGradient)" stroke-width="0.8" stroke-linecap="round"/>
</svg>