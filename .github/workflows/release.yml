name: Build & Release Everywhere Extensions (VS Code, Visual Studio & IntelliJ)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex: 0.1.0 - deixe em branco para usar a tag ou padrão)'
        required: false
        default: ''
      publish_marketplace:
        description: 'Publicar no Visual Studio Marketplace?'
        required: false
        type: boolean
        default: true

# Um único run por ref: evita uploads simultâneos do mesmo asset na Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Resolve Release Version (from Tag or Input)
  # -------------------------------------------------------------
  get-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            RAW_VER="${{ github.ref_name }}"
          else
            RAW_VER="0.1.0"
          fi
          # Strip leading 'v' if present (e.g. v0.0.1 -> 0.0.1)
          CLEAN_VER="${RAW_VER#v}"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "🏷️ Resolved version: ${CLEAN_VER}"

  # -------------------------------------------------------------
  # 1. VS Code Extension (.vsix)
  # -------------------------------------------------------------
  build-vscode:
    name: Build VS Code VSIX
    needs: get-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vscode/package-lock.json

      - name: Apply version from tag
        working-directory: vscode
        run: |
          npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Build extension
        working-directory: vscode
        run: npm run build

      - name: Package VSIX
        working-directory: vscode
        run: |
          node scripts/package.mjs
          # Nome único por IDE: evita colisão com o VSIX do Visual Studio na Release
          mv everywhere-${{ needs.get-version.outputs.version }}.vsix everywhere-vscode-${{ needs.get-version.outputs.version }}.vsix

      - name: Upload VSIX as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-vscode-${{ needs.get-version.outputs.version }}-vsix
          path: vscode/*.vsix
          retention-days: 30

      - name: Attach VSIX to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' && (github.event_name == 'release' || github.event.inputs.publish_marketplace == true) }}
        working-directory: vscode
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          echo "🚀 Publicando extensão no Visual Studio Marketplace..."
          VSIX_FILE=$(ls *.vsix | head -n 1)
          npx @vscode/vsce publish --packagePath "$VSIX_FILE" -p "$VS_MARKETPLACE_TOKEN" --no-dependencies --skip-license
          echo "✅ Publicação concluída com sucesso!"

      - name: Marketplace Notice (quando token não estiver configurado)
        if: ${{ env.VS_MARKETPLACE_TOKEN == '' }}
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          echo "::notice title=Marketplace Publish Skipped::O arquivo .vsix foi gerado e anexado aos artefatos da Release. Para habilitar a publicação automática no Visual Studio Marketplace, adicione o secret 'VS_MARKETPLACE_TOKEN' nas configurações do repositório (Settings -> Secrets and variables -> Actions)."

  # -------------------------------------------------------------
  # 2. Visual Studio 2022 Extension (.vsix)
  # -------------------------------------------------------------
  build-visualstudio-2022:
    name: Build Visual Studio 2022 VSIX
    needs: get-version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply version from tag
        shell: pwsh
        run: |
          $ver = "${{ needs.get-version.outputs.version }}"
          $manifestPath = "visualstudio/Everywhere/source.extension.vsixmanifest"
          $content = Get-Content $manifestPath -Raw
          # Atualiza APENAS o atributo Version da tag <Identity>, preservando PackageManifest Version="2.0.0"
          $content = [regex]::Replace($content, '(<Identity\b[^>]*?\bVersion=")[^"]+(")', "`${1}$ver`${2}")
          Set-Content -Path $manifestPath -Value $content -NoNewline
          Write-Host "Updated Identity version in vsixmanifest to $ver"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild visualstudio/Everywhere/Everywhere.csproj /t:Restore

      - name: Build VSIX with MSBuild
        run: msbuild visualstudio/Everywhere/Everywhere.csproj /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /p:Version=${{ needs.get-version.outputs.version }} /p:VsixVersion=${{ needs.get-version.outputs.version }} /v:normal

      - name: Diagnose build output
        shell: pwsh
        run: |
          Write-Host "--- Build output files ---"
          Get-ChildItem -Path visualstudio/Everywhere/bin -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName.Replace($PWD.Path, '.') }

      - name: Package VSIX manually (fallback if MSBuild did not emit it)
        shell: pwsh
        run: |
          if (Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse -ErrorAction SilentlyContinue) {
            Write-Host "VSIX already produced by MSBuild, skipping fallback."
            exit 0
          }
          $ver = "${{ needs.get-version.outputs.version }}"
          $out = Get-ChildItem -Path visualstudio/Everywhere/bin -Recurse -Filter Everywhere.dll | Select-Object -First 1
          if (-not $out) { Write-Error "Everywhere.dll not found"; exit 1 }
          $dir = $out.DirectoryName
          $stage = Join-Path $PWD "vsix-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Ship project output: ONLY extension assemblies and direct runtime dependencies
          # (strictly exclude Visual Studio SDK/IDE assemblies, Microsoft.VisualStudio.*, VSLangProj*, StreamJsonRpc*, etc.)
          Get-ChildItem -Path $dir -File | Where-Object {
            $_.Extension -in '.dll' -and
            $_.Name -notlike 'Microsoft.VisualStudio.*' -and
            $_.Name -notlike 'Microsoft.VSSDK.*' -and
            $_.Name -notlike 'Microsoft.ServiceHub.*' -and
            $_.Name -notlike 'Microsoft.Build.*' -and
            $_.Name -notlike 'StreamJsonRpc*' -and
            $_.Name -notlike 'VSLangProj*' -and
            $_.Name -notlike 'envdte*'
          } | Copy-Item -Destination $stage

          # Copy WebView2 native runtimes if present (win-x64, win-arm64, win-x86)
          if (Test-Path "$dir/runtimes") {
            Copy-Item -Path "$dir/runtimes" -Destination $stage -Recurse -Force
          }

          Copy-Item visualstudio/Everywhere/Everywhere.pkgdef $stage
          Copy-Item visualstudio/Everywhere/LICENSE.txt $stage
          New-Item -ItemType Directory -Force -Path "$stage/Resources" | Out-Null
          Copy-Item visualstudio/Everywhere/Resources/*.png "$stage/Resources"

          # Manifest
          Copy-Item visualstudio/Everywhere/source.extension.vsixmanifest (Join-Path $stage 'extension.vsixmanifest')

          # Content Types ([Content_Types].xml) with UTF-8 BOM matching working reference
          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $ct = '<?xml version="1.0" encoding="utf-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="vsixmanifest" ContentType="text/xml" /><Default Extension="json" ContentType="application/json" /><Default Extension="dll" ContentType="application/octet-stream" /><Default Extension="pkgdef" ContentType="text/plain" /><Default Extension="png" ContentType="application/octet-stream" /><Default Extension="txt" ContentType="text/plain" /></Types>'
          [System.IO.File]::WriteAllText((Join-Path $stage '[Content_Types].xml'), $ct, $utf8WithBom)

          # Calculate total uncompressed size and file list for VSIX v3 metadata
          $allFiles = Get-ChildItem -Path $stage -Recurse -File | Where-Object { $_.Name -ne '[Content_Types].xml' }
          $totalSize = ($allFiles | Measure-Object -Property Length -Sum).Sum
          if ($totalSize -le 0) { $totalSize = 1048576 }

          $fileList = @()
          foreach ($f in $allFiles) {
            $rel = "/" + $f.FullName.Substring($stage.Length).TrimStart('\', '/').Replace('\', '/')
            $fileList += [ordered]@{ fileName = $rel; sha256 = $null }
          }

          # manifest.json matching working reference schema (saved WITHOUT BOM)
          $manifestObj = [ordered]@{
            id = "Everywhere.DeepSeek.VSIX"
            version = $ver
            type = "Vsix"
            vsixId = "Everywhere.DeepSeek.VSIX"
            extensionDir = "[installdir]\Common7\IDE\Extensions\Everywhere"
            files = $fileList
            installSizes = [ordered]@{
              targetDrive = [int64]$totalSize
            }
            dependencies = [ordered]@{
              "Microsoft.VisualStudio.Component.CoreEditor" = "17.0"
            }
          }
          $manifestJson = $manifestObj | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText((Join-Path $stage 'manifest.json'), $manifestJson, $utf8NoBom)

          # catalog.json matching working reference schema (saved WITHOUT BOM)
          $catalogObj = [ordered]@{
            manifestVersion = "1.1"
            info = [ordered]@{
              id = "Everywhere.DeepSeek.VSIX,version=$ver"
              manifestType = "Extension"
            }
            packages = @(
              [ordered]@{
                id = "Component.Everywhere.DeepSeek.VSIX"
                version = $ver
                type = "Component"
                extension = $true
                dependencies = [ordered]@{
                  "Everywhere.DeepSeek.VSIX" = $ver
                  "Microsoft.VisualStudio.Component.CoreEditor" = "17.0"
                }
                localizedResources = @(
                  [ordered]@{
                    language = "en-US"
                    title = "Everywhere - DeepSeek Harness for Visual Studio"
                    description = "Connect Visual Studio 2022 to the official DeepSeek Harness autonomous AI agent runtime."
                  }
                )
              },
              [ordered]@{
                id = "Everywhere.DeepSeek.VSIX"
                version = $ver
                type = "Vsix"
                payloads = @(
                  [ordered]@{
                    fileName = "everywhere-visualstudio-$ver.vsix"
                    size = [int64]$totalSize
                  }
                )
                vsixId = "Everywhere.DeepSeek.VSIX"
                extensionDir = "[installdir]\Common7\IDE\Extensions\Everywhere"
                installSizes = [ordered]@{
                  targetDrive = [int64]$totalSize
                }
              }
            )
          }
          $catalogJson = $catalogObj | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText((Join-Path $stage 'catalog.json'), $catalogJson, $utf8NoBom)

          # Package into ZIP using forward-slash ZipArchive entries (Open Packaging Conventions compliant)
          $dest = "visualstudio/Everywhere/bin/Release/everywhere-visualstudio-$ver.vsix"
          $destDir = Split-Path (Join-Path $PWD $dest)
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $destPath = Join-Path $PWD $dest
          if (Test-Path $destPath) { Remove-Item $destPath -Force }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipStream = [System.IO.File]::Create($destPath)
          $archive = New-Object System.IO.Compression.ZipArchive($zipStream, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path $stage -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($stage.Length).TrimStart('\', '/').Replace('\', '/')
              $entry = $archive.CreateEntry($rel, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              try {
                $fileStream = [System.IO.File]::OpenRead($_.FullName)
                try {
                  $fileStream.CopyTo($entryStream)
                } finally {
                  $fileStream.Dispose()
                }
              } finally {
                $entryStream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
            $zipStream.Dispose()
          }
          Write-Host "Fallback VSIX created: $dest ($((Get-Item $destPath).Length) bytes)"

      - name: Locate generated VSIX
        shell: pwsh
        run: |
          $vsixFiles = Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse
          if ($vsixFiles.Count -eq 0) {
            Write-Error "No VSIX file found in visualstudio folder!"
            exit 1
          }
          # Normaliza o nome (caso o MSBuild tenha gerado Everywhere.vsix)
          $ver = "${{ needs.get-version.outputs.version }}"
          foreach ($f in $vsixFiles) {
            $target = "everywhere-visualstudio-$ver.vsix"
            if ($f.Name -ne $target) { Rename-Item -LiteralPath $f.FullName -NewName $target -Force }
          }
          Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse |
            ForEach-Object { Write-Host "Found VSIX: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload VS 2022 VSIX as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-visualstudio-${{ needs.get-version.outputs.version }}-vsix
          path: visualstudio/**/*.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Attach VS 2022 VSIX to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: visualstudio/**/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 3. IntelliJ IDEA Plugin (.zip)
  # -------------------------------------------------------------
  build-intellij:
    name: Build IntelliJ IDEA Plugin
    needs: get-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x intellij/gradlew

      - name: Build Plugin with Gradle
        working-directory: intellij
        run: ./gradlew buildPlugin -PpluginVersion=${{ needs.get-version.outputs.version }} --no-daemon

      - name: Upload IntelliJ Plugin as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-intellij-${{ needs.get-version.outputs.version }}-plugin
          path: intellij/build/distributions/*.zip
          retention-days: 30

      - name: Attach IntelliJ Plugin to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: intellij/build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
